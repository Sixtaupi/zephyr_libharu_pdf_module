name: Documentation

on:
  pull_request:
  push:
    branches:
      - zephyr

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      DOC_VERSION: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || '' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r doc/requirements.txt
      - name: Build HTML documentation
        run: python -m sphinx -W --keep-going -b html doc build/docs
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.run_id }}
          path: build/docs
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/zephyr'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/zephyr'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    name: Publish documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/zephyr'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
